<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Songarooni</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>Songarooni</h1>
  </header>

  <div id="controls">
    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>
    <button id="mute-btn">Mute</button>
    <button id="logo-btn">Logo</button>
    <button id="live-btn">🔴 Go Live</button>
    <button id="default-btn">Generic</button>
    <input type="file" id="candid-input" accept="image/*" multiple hidden>
  </div>

  <div id="search-row">
    <input id="search" type="search" placeholder="Search songs…" autocomplete="off">
    <select id="sort-by"></select>
    <button id="candid-btn">📷 Candid</button>
  </div>

  <div id="default-tempo">
    <label for="tempo-input">Manual tempo</label>
    <input id="tempo-input" type="number" min="1" max="300" inputmode="numeric">
    <button id="tempo-set-btn">Set</button>
  </div>

  <div id="camera-config">
    <label for="camera-ip-input">Camera</label>
    <input id="camera-ip-input" type="text" placeholder="IP address" autocomplete="off">
    <input id="camera-port-input" type="number" min="1" max="65535" placeholder="Port">
    <button id="camera-save-btn">Save</button>
    <button id="camera-find-btn">Find Camera</button>
  </div>

  <div id="now-playing">
    <div id="now-title">No song selected</div>
    <div id="now-tempo"></div>
    <div id="up-next"></div>
  </div>

  <div id="error"></div>

  <div id="song-list-wrap">
    <ul id="song-list"></ul>
  </div>


  <script src="/app.js"></script>
</body>
</html>
